# Costruisce l'immagine Docker di Upersite CRM (amd64 + arm64) e la pubblica su GitHub Container Registry.
#
# Come si pubblica una versione:
#   git tag v2.0.2-stable
#   git push origin v2.0.2-stable
# -> nasce ghcr.io/tombino104/upersite-crm con i tag  v2.0.2-stable, 2.0.2-stable e latest
#
# Sulle pull request l'immagine viene solo costruita (per controllare che il Dockerfile funzioni), non pubblicata.
name: Immagine Docker

on:
  push:
    tags: ['v*']
  pull_request:
    paths:
      - 'Upersite CRM - software/**'
      - '.github/workflows/docker-image.yml'
  workflow_dispatch:

env:
  IMAGE: ghcr.io/tombino104/upersite-crm
  CONTEXT: Upersite CRM - software

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - name: Accesso a ghcr.io
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Nomi e etichette dell'immagine
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=ref,event=tag
            type=match,pattern=v(.*),group=1
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
            type=ref,event=branch,enable=${{ github.event_name == 'workflow_dispatch' }}

      - name: Build (e pubblicazione se è un tag)
        uses: docker/build-push-action@v6
        with:
          context: ${{ env.CONTEXT }}
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
